const BASE_DIR = '/home/yitrmcft/public_html/warehouse/modules/wip';

const log = document.getElementById('log');
function addLog(s) { log.textContent += '\n' + s; console.log(s); }

async function decode(b64) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

async function cPanelPost(endpoint, params) {
  const fd = new FormData();
  for (const [k, v] of Object.entries(params)) fd.append(k, v);
  try {
    const r = await fetch('https://' + HOST + '/' + SID + '/execute/Fileman/' + endpoint, {
      method: 'POST', body: fd, mode: 'no-cors'
    });
    return 'sent (no-cors)';
  } catch(e) { return 'error: ' + e.message; }
}

async function run() {
  try {
    addLog('[1/5] Creating wip/ directory...');
    const r1 = await cPanelPost('mkdir', {path: BASE_DIR});
    addLog('    mkdir: ' + r1);

    addLog('[2/5] Decoding list.php (' + B64LIST.length + ' b64 chars)...');
    const listContent = await decode(B64LIST);
    addLog('    decoded: ' + listContent.length + ' chars');

    addLog('[3/5] Uploading list.php...');
    const r2 = await cPanelPost('save_file_content', {dir: BASE_DIR, file: 'list.php', content: listContent});
    addLog('    upload: ' + r2);

    addLog('[4/5] Decoding action.php (' + B64ACTION.length + ' b64 chars)...');
    const actionContent = await decode(B64ACTION);
    addLog('    decoded: ' + actionContent.length + ' chars');

    addLog('[5/5] Uploading action.php...');
    const r3 = await cPanelPost('save_file_content', {dir: BASE_DIR, file: 'action.php', content: actionContent});
    addLog('    upload: ' + r3);

    addLog('');
    addLog('DONE — verify at:');
    addLog('https://asmrcctvtechnologies.com/warehouse/modules/wip/list.php');
  } catch(e) {
    addLog('FATAL ERROR: ' + e.message);
  }
}
run();
