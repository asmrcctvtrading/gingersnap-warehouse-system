<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odyssey Task List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #3d3d5c;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #999;
            font-size: 14px;
        }

        .category {
            margin-bottom: 15px;
            background: #2d2d3d;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #3d3d5c;
            transition: all 0.3s ease;
        }

        .category:hover {
            border-color: #7c3aed;
            background: #333344;
        }

        .category-header {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            font-weight: 600;
            color: #e0e0e0;
            transition: background 0.2s;
        }

        .category-header:hover {
            background: #3d3d4d;
        }

        .category-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-count {
            font-size: 12px;
            color: #999;
            background: #1e1e2e;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: auto;
        }

        .toggle-icon {
            display: inline-block;
            transition: transform 0.3s;
            font-size: 16px;
        }

        .category.collapsed .toggle-icon {
            transform: rotate(-90deg);
        }

        .tasks {
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .category.collapsed .tasks {
            max-height: 0;
        }

        .task {
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid #3d3d5c;
            transition: background 0.2s;
        }

        .task:hover {
            background: #353545;
        }

        .task-icon {
            font-size: 18px;
            min-width: 24px;
            text-align: center;
        }

        .task-info {
            flex: 1;
        }

        .task-name {
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 4px;
        }

        .task-status {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            font-weight: 500;
        }

        .task-status.pending {
            background: #3d3d5c;
            color: #b0b0c0;
        }

        .task-status.in-progress {
            background: #4a3a2a;
            color: #ffa500;
        }

        .task-status.warning {
            background: #5c2a2a;
            color: #ff6b6b;
        }

        .task-status.completed {
            background: #2a4a2a;
            color: #51cf66;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #3d3d5c;
        }

        .stat {
            text-align: center;
            padding: 12px;
            background: #2d2d3d;
            border-radius: 6px;
            border: 1px solid #3d3d5c;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #7c3aed;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #3d3d5c;
            color: #666;
            font-size: 12px;
        }

        .search-box {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 20px;
            background: #2d2d3d;
            border: 1px solid #3d3d5c;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 14px;
        }

        .search-box::placeholder {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Odyssey Tasks</h1>
            <p>All projects and tasks at a glance</p>
        </div>

        <input type="text" class="search-box" id="searchBox" placeholder="Search tasks...">

        <div id="tasksContainer"></div>

        <div class="stats">
            <div class="stat">
                <div class="stat-number" id="totalCount">14</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="pendingCount">12</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="warningCount">1</div>
                <div class="stat-label">Warnings</div>
            </div>
        </div>

        <div class="footer">
            Updated: <span id="timestamp"></span>
        </div>
    </div>

    <script>
        const tasksData = {
            omniroute: {
                icon: '📁',
                tasks: [
                    { icon: '⭐', name: 'Full provider health check', status: 'pending' },
                    { icon: '🔐', name: 'OAuth configuration update', status: 'in-progress' }
                ]
            },
            warehouse: {
                icon: '📁',
                tasks: [
                    { icon: '📦', name: 'Warehouse system process assessment', status: 'pending' },
                    { icon: '🗄️', name: 'Database schema optimization', status: 'pending' }
                ]
            },
            ponytail: {
                icon: '📁',
                tasks: [
                    { icon: '📋', name: 'Ponytail installation guide', status: 'pending' }
                ]
            },
            claude_code: {
                icon: '📁',
                tasks: [
                    { icon: '⚙️', name: 'Claude code output optimization', status: 'pending' }
                ]
            },
            cpanel: {
                icon: '📁',
                tasks: [
                    { icon: '🧹', name: 'cPanel file audit and cleanup', status: 'pending' }
                ]
            },
            validation: {
                icon: '📁',
                tasks: [
                    { icon: '✓', name: 'GSM Baliwag May 2026 validation', status: 'pending' },
                    { icon: '⚠️', name: 'Uniommerce data extraction', status: 'warning' }
                ]
            },
            admin: {
                icon: '📁',
                tasks: [
                    { icon: '👤', name: 'Personal Facebook account audit', status: 'pending' },
                    { icon: '🎁', name: 'Gift Certificate transaction in Baliwag', status: 'pending' }
                ]
            },
            gingersnaps: {
                icon: '📁',
                tasks: [
                    { icon: '🍪', name: 'Gingersnaps Uniommerce adjustment', status: 'pending' },
                    { icon: '📊', name: 'Weekly IT report proofreading', status: 'pending' }
                ]
            },
            bartermms: {
                icon: '📁',
                tasks: [
                    { icon: '📢', name: 'BarterMMS promotions investigation', status: 'pending' }
                ]
            }
        };

        const categoryNames = {
            omniroute: 'OmniRoute',
            warehouse: 'Warehouse System',
            ponytail: 'Ponytail Setup',
            claude_code: 'Claude Code',
            cpanel: 'cPanel Cleanup',
            validation: 'Validation & Data',
            admin: 'Admin Tasks',
            gingersnaps: 'Gingersnaps',
            bartermms: 'BarterMMS'
        };

        function renderTasks(filterText = '') {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';

            Object.entries(tasksData).forEach(([key, data]) => {
                const categoryName = categoryNames[key];
                const filteredTasks = data.tasks.filter(task =>
                    task.name.toLowerCase().includes(filterText.toLowerCase()) ||
                    categoryName.toLowerCase().includes(filterText.toLowerCase())
                );

                if (filteredTasks.length === 0 && filterText) return;

                const category = document.createElement('div');
                category.className = 'category';
                category.innerHTML = `
                    <div class="category-header">
                        <div class="category-title">
                            <span class="toggle-icon">▶</span>
                            <span>${data.icon} ${categoryName}</span>
                        </div>
                        <span class="category-count">${filteredTasks.length}</span>
                    </div>
                    <div class="tasks">
                        ${filteredTasks.map(task => `
                            <div class="task">
                                <div class="task-icon">${task.icon}</div>
                                <div class="task-info">
                                    <div class="task-name">${task.name}</div>
                                    <span class="task-status ${task.status}">${task.status}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;

                category.querySelector('.category-header').addEventListener('click', () => {
                    category.classList.toggle('collapsed');
                });

                container.appendChild(category);
            });
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent = now.toLocaleString();
        }

        document.getElementById('searchBox').addEventListener('input', (e) => {
            renderTasks(e.target.value);
        });

        // Initial render
        renderTasks();
        updateTimestamp();

        // Update timestamp every minute
        setInterval(updateTimestamp, 60000);
    </script>
</body>
</html>
